name: Cloud AI Companion (read-only, Qwen3 Instruct)

on:
  push:
    branches:
      - feature/cloud-companion-prototype
  workflow_dispatch:
    inputs:
      question:
        description: "Question or task for the AI companion (do not include secrets or personal data)"
        required: true
        type: string
        default: "Изучи структуру Pleer1-Next, объясни назначение файлов и предложи следующие безопасные шаги."

permissions:
  contents: read

concurrency:
  group: cloud-companion-instruct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  companion:
    name: Diagnose Ollama and OpenCode model discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start temporary Ollama model server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ollama ollama pull qwen3:4b-instruct

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Diagnose Ollama and OpenCode model discovery
        env:
          QUESTION: ${{ github.event.inputs.question || 'Изучи структуру Pleer1-Next, объясни назначение файлов и предложи следующие безопасные шаги.' }}
          CI: "true"
        shell: bash
        run: |
          set +e
          REPORT="companion-diagnostics.txt"
          exec > >(tee "$REPORT") 2>&1

          echo "=== Runtime versions ==="
          ollama_version="$(docker exec ollama ollama --version 2>&1)"
          echo "$ollama_version"
          opencode --version
          echo

          echo "=== Ollama local inventory ==="
          docker exec ollama ollama list
          echo

          echo "=== Ollama native /api/tags ==="
          curl --silent --show-error --fail http://127.0.0.1:11434/api/tags | python -m json.tool
          echo

          echo "=== Ollama native /api/show ==="
          curl --silent --show-error --fail             -H "Content-Type: application/json"             -d '{"name":"qwen3:4b-instruct"}'             http://127.0.0.1:11434/api/show | python -m json.tool
          echo

          echo "=== Ollama OpenAI-compatible /v1/models ==="
          curl --silent --show-error --fail http://127.0.0.1:11434/v1/models | python -m json.tool
          echo

          echo "=== OpenCode discovered Ollama models ==="
          opencode models ollama --refresh --verbose
          echo "OpenCode models exit code: $?"
          echo

          echo "=== OpenCode debug run (read-only agent) ==="
          opencode run             --print-logs             --log-level DEBUG             --standalone             --agent cloud-readonly             --model ollama/qwen3:4b-instruct             --format json             "$QUESTION"
          echo "OpenCode run exit code: $?"

          echo
          echo "Diagnostics completed; failures above are intentionally captured for inspection."
          exit 0

      - name: Upload companion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-next-companion-diagnostics
          path: companion-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
