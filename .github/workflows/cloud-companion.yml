name: Ollama Qwen3 Thinking Diagnostic (read-only)

on:
  push:
    branches:
      - feature/cloud-companion-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-diagnostic:
    name: Inspect Qwen3 thinking controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start temporary Ollama model server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ollama ollama pull qwen3:4b
          curl --silent --show-error --fail http://127.0.0.1:11434/api/version --output ollama-version.json
          node -e 'const fs=require("fs"); fs.writeFileSync("ollama-show-request.json", JSON.stringify({model:"qwen3:4b"}));'
          curl --silent --show-error --fail -H "Content-Type: application/json" --data-binary @ollama-show-request.json http://127.0.0.1:11434/api/show --output qwen3-show.json

      - name: Compare native Generate and Chat with thinking disabled
        env:
          QUESTION: "Напиши ровно одно слово ГОТОВО."
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const prompt=process.env.QUESTION; fs.writeFileSync("ollama-generate-request.json", JSON.stringify({model:"qwen3:4b",prompt,stream:false,think:false,options:{num_predict:512},keep_alive:"5m"})); fs.writeFileSync("ollama-chat-request.json", JSON.stringify({model:"qwen3:4b",messages:[{role:"user",content:prompt}],stream:false,think:false,options:{num_predict:512},keep_alive:"5m"}));'
          curl --silent --show-error --fail-with-body --max-time 600 -H "Content-Type: application/json" --data-binary @ollama-generate-request.json http://127.0.0.1:11434/api/generate --output ollama-generate-result.json
          curl --silent --show-error --fail-with-body --max-time 600 -H "Content-Type: application/json" --data-binary @ollama-chat-request.json http://127.0.0.1:11434/api/chat --output ollama-chat-result.json
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync("ollama-generate-result.json","utf8")); const c=JSON.parse(fs.readFileSync("ollama-chat-result.json","utf8")); console.log("GENERATE thinking field:",JSON.stringify(g.thinking??null)); console.log("GENERATE response:",g.response); console.log("CHAT thinking field:",JSON.stringify(c.message?.thinking??null)); console.log("CHAT content:",c.message?.content); console.log("Generate tokens:",g.eval_count,"Chat tokens:",c.eval_count); if(!g.response?.trim() || !c.message?.content?.trim()) process.exit(1);'

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-thinking-diagnostic
          path: |
            ollama-version.json
            qwen3-show.json
            ollama-show-request.json
            ollama-generate-request.json
            ollama-chat-request.json
            ollama-generate-result.json
            ollama-chat-result.json
          if-no-files-found: warn
          retention-days: 7
