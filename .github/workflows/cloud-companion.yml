name: Cloud AI Companion (read-only, Qwen3 Instruct)

on:
  push:
    branches:
      - feature/cloud-companion-prototype
  workflow_dispatch:
    inputs:
      question:
        description: "Question or task for the AI companion (do not include secrets or personal data)"
        required: true
        type: string
        default: "Сверь актуальный контекст Pleer1, оцени готовность компаньона и назови один следующий безопасный шаг."

permissions:
  contents: read

concurrency:
  group: cloud-companion-instruct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  companion:
    name: Context-aware read-only engineering review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start temporary Ollama model server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -e OLLAMA_CONTEXT_LENGTH=32768 -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ollama ollama pull qwen3:4b-instruct

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Run context-aware read-only analysis
        env:
          QUESTION: ${{ github.event.inputs.question }}
          CI: "true"
        shell: bash
        run: |
          set +e
          REPORT="companion-diagnostics.txt"
          exec > >(tee "$REPORT") 2>&1

          if [[ -z "${QUESTION:-}" ]]; then
            QUESTION="$(cat <<'EOF'
          Прочитай полностью AGENTS.md, README.md, docs/ARCHITECTURE.md, docs/YOUTUBE-SEARCH-DIAGNOSTICS.md и docs/PLEER1-CURRENT-CONTEXT.md. Затем выполни контекстную проверку готовности компаньона и проекта Pleer1.

          Важно: этот публичный репозиторий содержит только документацию и конфигурацию компаньона, не исходный код приложения Pleer1. Не заявляй, что изучил реализацию, проверил исправление, собрал приложение или запустил симулятор. Не пытайся получать данные из других репозиториев. Не повторяй заново диагностику Build #14 и не выдумывай новые причины уже обсуждённой проблемы.

          Сформируй отчёт:
          1. Какие файлы и факты реально доступны в текущем checkout.
          2. Что известно о текущем этапе проекта и согласованной последовательности работ.
          3. Какие факты Build #14 остаются полезными, а какие выводы из них делать нельзя.
          4. Чем подтверждён запуск компаньона #22 и чего он не доказал.
          5. Какие данные отсутствуют для анализа реализации — перечисли конкретно, не запрашивая исходники целиком.
          6. Один следующий безопасный шаг, который не нарушает границы репозиториев и не меняет порядок проекта.

          Строго отделяй подтверждённое от пересказа журнала и гипотез. Краткий статус в конце: «Подтверждено / Не подтверждено / Ограничение контекста / Следующий шаг».
          EOF
          )"
          fi

          echo "=== Runtime versions ==="
          docker exec ollama ollama --version
          opencode --version
          echo

          echo "=== Ollama model inventory ==="
          docker exec ollama ollama list
          echo

          echo "=== Ollama model metadata ==="
          curl --silent --show-error --fail -H "Content-Type: application/json" -d '{"name":"qwen3:4b-instruct"}' http://127.0.0.1:11434/api/show | python -m json.tool
          echo

          echo "=== OpenCode discovered Ollama models ==="
          opencode models
          echo

          echo "=== OpenCode context-aware analysis ==="
          opencode run --print-logs --log-level debug --standalone --agent cloud-readonly --model ollama/qwen3:4b-instruct --format json "$QUESTION"
          echo "OpenCode run exit code: $?"
          echo

          echo "=== Ollama allocated model context after analysis ==="
          docker exec ollama ollama ps
          echo

          echo "Diagnostics completed; inspect report content, not only workflow conclusion."
          exit 0

      - name: Upload companion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-next-companion-diagnostics
          path: companion-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
