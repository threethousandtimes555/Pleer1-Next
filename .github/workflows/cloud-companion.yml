name: Ollama Direct Model Smoke Test (read-only)

on:
  push:
    branches:
      - feature/cloud-companion-prototype
  workflow_dispatch:
    inputs:
      question:
        description: "Short test prompt for the local Qwen3 model"
        required: true
        type: string
        default: "Напиши ровно одно слово ГОТОВО."

permissions:
  contents: read

concurrency:
  group: ollama-direct-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-smoke-test:
    name: Test Qwen3 directly through Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start temporary Ollama model server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ollama ollama pull qwen3:4b

      - name: Ask Qwen3 directly (without OpenCode)
        env:
          QUESTION: ${{ github.event.inputs.question || 'Напиши ровно одно слово ГОТОВО.' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$QUESTION" > direct-test-prompt.txt
          node -e 'const fs=require("fs"); const prompt=fs.readFileSync("direct-test-prompt.txt","utf8").trim(); fs.writeFileSync("ollama-request.json", JSON.stringify({model:"qwen3:4b", prompt, stream:false, think:false, options:{num_predict:256}, keep_alive:"5m"}));'
          echo "Sending a short prompt directly to Ollama API (10-minute request limit)..."
          curl --silent --show-error --fail-with-body --max-time 600 \
            -H "Content-Type: application/json" \
            --data-binary @ollama-request.json \
            http://127.0.0.1:11434/api/generate \
            --output ollama-direct-test.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("ollama-direct-test.json","utf8")); if(typeof r.response!=="string" || !r.response.trim()) { console.error("Ollama returned no text response"); process.exit(1); } console.log("DIRECT_MODEL_RESPONSE:"); console.log(r.response); console.log("MODEL:",r.model); console.log("TOTAL_DURATION_NS:",r.total_duration);'

      - name: Upload direct model test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-direct-model-test
          path: |
            direct-test-prompt.txt
            ollama-request.json
            ollama-direct-test.json
          if-no-files-found: warn
          retention-days: 7
