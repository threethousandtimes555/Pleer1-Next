name: Cloud AI Companion (read-only, Qwen3 Instruct)

on:
  push:
    branches:
      - feature/cloud-companion-prototype
  workflow_dispatch:
    inputs:
      question:
        description: "Question or task for the AI companion (do not include secrets or personal data)"
        required: true
        type: string
        default: "Проведи read-only анализ диагностических материалов Build #14 и подготовь инженерный отчёт."

permissions:
  contents: read

concurrency:
  group: cloud-companion-instruct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  companion:
    name: Focused read-only YouTube diagnostics review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start temporary Ollama model server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -e OLLAMA_CONTEXT_LENGTH=32768 -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ollama ollama pull qwen3:4b-instruct

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Run focused read-only diagnostics
        env:
          QUESTION: ${{ github.event.inputs.question }}
          CI: "true"
        shell: bash
        run: |
          set +e
          REPORT="companion-diagnostics.txt"
          exec > >(tee "$REPORT") 2>&1

          if [[ -z "${QUESTION:-}" ]]; then
            QUESTION="$(cat <<'EOF'
Проанализируй только документацию лаборатории Pleer1-Next по диагностике YouTube из docs/YOUTUBE-SEARCH-DIAGNOSTICS.md, а также AGENTS.md, README.md и docs/ARCHITECTURE.md. Подготовь инженерный отчёт по Build #14: какие наблюдения подтверждены; что нельзя заключить из-за отсутствия searchID и связки событий; какие конкретные поля логов и минимальные тесты нужны, чтобы отличить потерю результата при парсинге от фильтрации или UI; и какой один следующий безопасный шаг. Репозиторий содержит документацию и конфигурацию компаньона, но не исходный код приложения Pleer1: не утверждай, что проверил реализацию или нашёл ошибку в коде. Не предлагай менять UI, другие репозитории или разрешения. Только чтение. Отделяй факты, гипотезы и неизвестное.
EOF
)"
          fi

          echo "=== Runtime versions ==="
          docker exec ollama ollama --version
          opencode --version
          echo

          echo "=== Ollama model inventory ==="
          docker exec ollama ollama list
          echo

          echo "=== Ollama model metadata ==="
          curl --silent --show-error --fail -H "Content-Type: application/json" -d '{"name":"qwen3:4b-instruct"}' http://127.0.0.1:11434/api/show | python -m json.tool
          echo

          echo "=== OpenCode discovered Ollama models ==="
          opencode models
          echo

          echo "=== OpenCode focused read-only analysis ==="
          opencode run --print-logs --log-level debug --standalone --agent cloud-readonly --model ollama/qwen3:4b-instruct --format json "$QUESTION"
          echo "OpenCode run exit code: $?"
          echo

          echo "=== Ollama allocated model context after analysis ==="
          docker exec ollama ollama ps
          echo

          echo "Diagnostics completed; inspect the report content, not only the workflow exit code."
          exit 0

      - name: Upload companion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-next-companion-diagnostics
          path: companion-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
