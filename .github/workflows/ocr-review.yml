name: Open Code Review (manual)

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to compare against"
        required: true
        default: "main"
        type: string
      head_ref:
        description: "Feature branch to review"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ocr-review-${{ github.ref }}-${{ inputs.head_ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Analyze changes (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate refs
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid base ref"; exit 1; }
          [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid head ref"; exit 1; }
          [[ "$BASE_REF" != "$HEAD_REF" ]] || { echo "Base and head refs must differ"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0

      - name: Fetch base and head refs
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin             "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"             "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Open Code Review
        run: npm install --global @alibaba-group/open-code-review

      - name: Run review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_USE_ANTHROPIC }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCR_LLM_URL:-}" || -z "${OCR_LLM_TOKEN:-}" || -z "${OCR_LLM_MODEL:-}" || ! "${OCR_USE_ANTHROPIC:-}" =~ ^(true|false)$ ]]; then
            echo "::error::Configure OCR_LLM_URL, OCR_LLM_AUTH_TOKEN, OCR_LLM_MODEL and OCR_USE_ANTHROPIC (true/false) before running this workflow."
            exit 1
          fi
          ocr review             --from "origin/${BASE_REF}"             --to "origin/${HEAD_REF}"             --format json             --audience agent             > open-code-review.json

      - name: Upload review report
        if: always() && hashFiles('open-code-review.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: open-code-review-report
          path: open-code-review.json
          if-no-files-found: warn
          retention-days: 14
